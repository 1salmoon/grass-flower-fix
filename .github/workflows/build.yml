name: Build SimpleGrassFlower

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Android NDK r28c
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Find and unpack source
        id: proj
        shell: bash
        run: |
          set -euo pipefail

          # 1. Pick the newest .zip (by version-sort of its path) that contains xmake.lua
          BEST=""
          while IFS= read -r -d '' Z; do
            if unzip -Z1 "$Z" 2>/dev/null | grep -qE '(^|/)xmake\.lua$'; then
              echo "Source zip candidate: $Z"
              BEST="$Z"
            fi
          done < <(find . -type f -iname '*.zip' \
                     -not -path './.git/*' -not -path './_src/*' -print0 | sort -z -V)

          # 2. Unpack it, or fall back to loose files in the repo
          if [ -n "$BEST" ]; then
            echo "Using zip: $BEST"
            rm -rf _src && mkdir -p _src
            unzip -q -o "$BEST" -d _src
            ROOT=_src
          else
            echo "No source zip found, searching repo files"
            ROOT=.
          fi

          # 3. Shallowest xmake.lua under ROOT
          FILE=$(find "$ROOT" -name xmake.lua \
                   -not -path '*/.git/*' -not -path '*/build/*' \
                   -not -path '*/.xmake/*' -not -path './dist/*' \
                   $( [ "$ROOT" = "." ] && echo "-not -path ./_src/*" ) \
                 | awk '{ print gsub("/","/") " " $0 }' | sort -n | head -n1 | cut -d' ' -f2-)

          if [ -z "$FILE" ]; then
            echo "::error::xmake.lua not found in repo or in any .zip"
            find . -not -path './.git/*' | head -60
            exit 1
          fi

          DIR=$(dirname "$FILE")
          echo "Project dir: $DIR"
          test -f "$DIR/src/main.cpp" || { echo "::error::$DIR/src/main.cpp missing"; exit 1; }
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Configure
        working-directory: ${{ steps.proj.outputs.dir }}
        run: xmake f -y -p android -a arm64-v8a -m release --ndk="${{ steps.ndk.outputs.ndk-path }}"

      - name: Build
        working-directory: ${{ steps.proj.outputs.dir }}
        run: xmake -y

      - name: Collect outputs
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          find build -name "SimpleGrassFlower.levipack" -exec cp {} "$GITHUB_WORKSPACE/dist/" \;
          find build -name "libSimpleGrassFlower.so" -exec cp {} "$GITHUB_WORKSPACE/dist/" \;
          ls -la "$GITHUB_WORKSPACE/dist"
          test -f "$GITHUB_WORKSPACE/dist/SimpleGrassFlower.levipack"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleGrassFlower
          path: dist/*
          if-no-files-found: error

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
